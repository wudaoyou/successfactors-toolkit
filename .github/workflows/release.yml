name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # DOCKERHUB_TOKEN is an environment secret, released only to v* tags.
    environment: dockerhub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          git merge-base --is-ancestor HEAD origin/main
          test -f successfactors_toolkit/main.py
          python3 scripts/check_repository.py
      - name: Build distribution
        run: |
          pip install build
          python -m build
      - name: Check Docker Hub publication prerequisites
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$DOCKERHUB_TOKEN" || { echo "Configure the DOCKERHUB_TOKEN secret in the dockerhub environment."; exit 1; }
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "Release tag is not a valid Docker tag."; exit 1; }
      - name: Enable the containerd image store
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and load both release platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/amd64,linux/arm64
          tags: wudaoyou/successfactors-toolkit:${{ github.ref_name }}
      - name: Verify MCP initialization and tools on both platforms
        env:
          IMAGE: wudaoyou/successfactors-toolkit:${{ github.ref_name }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "Starting MCP smoke test for $platform"
            docker run --rm --platform "$platform" \
              --mount "type=bind,source=$PWD/tests/test_mcp_stdio.py,target=/app/tests/test_mcp_stdio.py,readonly" \
              "$IMAGE" python -c '
          import runpy
          import tempfile
          from pathlib import Path
          test = runpy.run_path("/app/tests/test_mcp_stdio.py")
          with tempfile.TemporaryDirectory() as directory:
              test["test_mcp_stdio_initialization_discovery_and_system_call"](
                  Path(directory), request_timeout_seconds=120
              )
          '
            echo "MCP smoke test succeeded for $platform"
          done
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: wudaoyou
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Refuse an already published Docker Hub tag
        env:
          DOCKERHUB_USERNAME: wudaoyou
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_docker_tag_absent.py wudaoyou/successfactors-toolkit "$RELEASE_TAG"
      - name: Publish the tested multi-platform image
        id: publish
        env:
          IMAGE: wudaoyou/successfactors-toolkit:${{ github.ref_name }}
        run: |
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" --raw | jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] |
            index("linux/amd64") != null and index("linux/arm64") != null'
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Published image digest is invalid."; exit 1; }
          image="docker.io/wudaoyou/successfactors-toolkit@$digest"
          printf '%s\n' "$image" > dist/image-reference.txt
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Keep the distributions and image reference for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The only job that can mint an OIDC token, and it does nothing but sign.
  attest:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Attest the published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/wudaoyou/successfactors-toolkit
          subject-digest: ${{ needs.publish.outputs.digest }}

  release:
    needs: [publish, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Fetch the distributions and image reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Verify published image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh attestation verify "oci://$IMAGE" --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Container image

          $IMAGE

          Verify its provenance with:

          \`gh attestation verify oci://$IMAGE --repo wudaoyou/successfactors-toolkit --signer-workflow wudaoyou/successfactors-toolkit/.github/workflows/release.yml --source-ref refs/tags/$RELEASE_TAG\`
          EOF
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}" dist/*

  # Lists the release in the MCP Registry. Its OIDC token proves the workflow
  # runs in wudaoyou/successfactors-toolkit, so no registry or GitHub token is
  # stored. Release candidates are not listed.
  registry:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISHER_VERSION: "1.8.1"
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
