name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest
      - name: Repository hygiene and version
        run: python3 scripts/check_repository.py
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          pattern = r"(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?!?: .+"
          if not re.fullmatch(pattern, os.environ["PR_TITLE"]):
              sys.exit("Use a Conventional Commit PR title, such as 'feat: add OData queries'.")
          PY

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t successfactors-toolkit:ci .
      - name: Smoke test container
        run: |
          container_id=$(docker run -d -p 127.0.0.1:8000:8000 successfactors-toolkit:ci)
          trap 'docker stop "$container_id"' EXIT

          ok=""
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health | grep -q '^200$'; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ -z "$ok" ]; then
            echo "Container did not report healthy within 20s" >&2
            docker logs "$container_id" >&2
            exit 1
          fi
