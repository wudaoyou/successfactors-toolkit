services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      SYSTEMS_DIR: /data/systems
    volumes:
      - systems:/data/systems
    # Locked down: read-only root filesystem, no capabilities. Writable: /data/systems, /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped

volumes:
  systems:
