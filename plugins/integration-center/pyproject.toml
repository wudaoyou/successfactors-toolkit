[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "successfactors-toolkit-integration-center"
version = "0.1.0"
description = "Read-only SAP SuccessFactors Integration Center plugin for the successfactors-toolkit MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Justin Gong" }]
dependencies = ["successfactors-toolkit"]

[project.entry-points."successfactors_toolkit.plugins"]
integration_center = "sf_integration_center:register"

[tool.setuptools.packages.find]
where = ["src"]
